name: Build Windows EXE

on:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Project Structure
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path app_src
          Get-ChildItem -Exclude "app_src", ".git", ".github" | Move-Item -Destination app_src
          
          $packageJson = @'
          {
            "name": "stp-dashboard",
            "version": "1.0.0",
            "productName": "STP DASHBOARD",
            "main": "main.js",
            "scripts": {
              "dist": "electron-builder --win nsis"
            },
            "build": {
              "appId": "com.stpdashboard.app",
              "directories": {
                "output": "dist"
              },
              "files": [
                "main.js",
                "app_src/**/*"
              ],
              "win": {
                "target": "nsis"
              },
              "publish": null
            }
          }
          '@
          Set-Content -Path package.json -Value $packageJson

          $mainJs = @'
          const { app, BrowserWindow } = require('electron');
          const path = require('path');

          function createWindow() {
            const win = new BrowserWindow({
              width: 1280,
              height: 800,
              autoHideMenuBar: true,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true
              }
            });

            win.loadFile(path.join(__dirname, 'app_src', 'index.html'));
          }

          app.whenReady().then(createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          '@
          Set-Content -Path main.js -Value $mainJs

      - name: Install Dependencies
        run: npm install --save-dev electron electron-builder

      - name: Build Windows Executable (.exe)
        run: npx electron-builder --win nsis -c.publish=never

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STP-DASHBOARD-Windows
          path: dist/*.exe
