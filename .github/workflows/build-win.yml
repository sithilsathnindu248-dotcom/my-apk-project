name: Build Windows EXE

on:
  push:
    branches:
      - main
      - master

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Create Windows App Files
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path windows-app
          
          $packageJson = @'
          {
            "name": "stp-dashboard",
            "version": "1.0.0",
            "productName": "STP DASHBOARD",
            "main": "main.js",
            "scripts": {
              "dist": "electron-builder --win nsis"
            },
            "build": {
              "appId": "com.stpdashboard.app",
              "directories": {
                "output": "dist"
              },
              "files": [
                "main.js",
                "index.html"
              ],
              "win": {
                "target": "nsis"
              },
              "publish": null
            },
            "devDependencies": {
              "electron": "^30.0.0",
              "electron-builder": "^24.13.3"
            }
          }
          '@
          Set-Content -Path windows-app/package.json -Value $packageJson

          $mainJs = @'
          const { app, BrowserWindow, screen } = require('electron');
          const path = require('path');

          function createWindow() {
            const primaryDisplay = screen.getPrimaryDisplay();
            const { width, height } = primaryDisplay.workAreaSize;

            const win = new BrowserWindow({
              width: width,
              height: height,
              autoHideMenuBar: true,
              webPreferences: {
                nodeIntegration: false,
                contextIsolation: true
              }
            });

            win.maximize();

            // Screen එකට exact fit වෙන විදිහට zoom එක auto-adjust කිරීම
            win.webContents.on('did-finish-load', () => {
              win.webContents.setZoomFactor(0.75);
            });

            win.loadFile(path.join(__dirname, 'index.html'));
          }

          app.whenReady().then(createWindow);

          app.on('window-all-closed', () => {
            if (process.platform !== 'darwin') app.quit();
          });
          '@
          Set-Content -Path windows-app/main.js -Value $mainJs

          Copy-Item -Path index.html -Destination windows-app/index.html

      - name: Install Dependencies
        working-directory: windows-app
        run: npm install

      - name: Build Windows Executable (.exe)
        working-directory: windows-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist

      - name: Upload Windows EXE Artifact
        uses: actions/upload-artifact@v4
        with:
          name: STP-DASHBOARD-Windows
          path: windows-app/dist/*.exe
